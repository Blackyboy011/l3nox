name: Build & deploy news

on:
  schedule:
    - cron: "*/15 * * * *"   # toutes les 15 minutes, jour et nuit
  workflow_dispatch:          # bouton "Run workflow" manuel
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Mémoire des alertes déjà notifiées (évite de recevoir deux fois la même)
      - uses: actions/cache@v4
        with:
          path: state
          key: l3nox-state-${{ github.run_id }}
          restore-keys: l3nox-state-
      - run: python build.py
        env:
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          L3NOX_AI_URL: ${{ vars.L3NOX_AI_URL }}
          L3NOX_AI_SECRET: ${{ secrets.L3NOX_AI_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
